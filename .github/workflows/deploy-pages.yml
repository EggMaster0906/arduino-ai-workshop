name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Install browser for E2E tests
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run typecheck && npm run test

      - name: Validate frontend mode
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_MOCK_AI: ${{ vars.VITE_MOCK_AI || 'true' }}
        run: |
          if [ "$VITE_MOCK_AI" != "true" ]; then
            if [ -z "$VITE_API_BASE_URL" ]; then
              echo "VITE_API_BASE_URL is required when VITE_MOCK_AI is not true."
              exit 1
            fi
            case "$VITE_API_BASE_URL" in
              https://*) ;;
              *) echo "VITE_API_BASE_URL must use HTTPS."; exit 1 ;;
            esac
          fi

      - name: Build frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_MOCK_AI: ${{ vars.VITE_MOCK_AI || 'true' }}
        run: npm run build --workspace @arduino-ai/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
